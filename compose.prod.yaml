services:
  traefik:
    image: traefik:latest
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  ui_api:
    environment:
      UI_API_SESSION_COOKIE_SECURE: "true"

  proxy:
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.counterparty.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.counterparty.entrypoints=websecure
      - traefik.http.routers.counterparty.tls=true
      - traefik.http.routers.counterparty.tls.certresolver=letsencrypt
      - traefik.http.routers.counterparty.priority=10
      - traefik.http.services.counterparty.loadbalancer.server.port=80

  maintenance:
    image: nginx:1.28-alpine
    restart: unless-stopped
    profiles: [maintenance]
    volumes:
      - ./deploy/maintenance/index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.counterparty-maintenance.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.counterparty-maintenance.entrypoints=websecure
      - traefik.http.routers.counterparty-maintenance.tls=true
      - traefik.http.routers.counterparty-maintenance.tls.certresolver=letsencrypt
      - traefik.http.routers.counterparty-maintenance.priority=100
      - traefik.http.services.counterparty-maintenance.loadbalancer.server.port=80

volumes:
  letsencrypt:
