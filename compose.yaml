# The full local stack: PostgreSQL with a durable volume, its migrations, the
# service login roles, the one-shot report import, the four services and one
# reverse proxy in front of them.
#
#   docker compose up -d                 # everything, in dependency order
#   docker compose run --rm import       # import again; the second run is a no-op
#   docker compose ps                    # health of every service
#
# Open http://localhost:5173 — the proxy is the only origin the browser needs,
# so the session cookie stays first-party and the SPA carries no API base URL.
# The direct service ports below are published for debugging and for the
# verification commands in README.md, not because the demo requires them.
#
# Three things this file deliberately does not do. It stores no real credential:
# every password and digest here is a local development default that a
# deployment overrides through the environment, and nothing here belongs in a
# shared cluster. No secret reaches the browser: `web` is a static bundle built
# with no environment at all. The agent holds its server-side MCP credential;
# MCP receives only the matching SHA256 digest. And it
# does not present the corpus as current information — `artifacts/` holds a mock
# snapshot, read in place and never copied or edited.
#
# Build context. Every Python image is built from the repository root, because
# the services depend on `packages/` by path and a context narrowed to the
# service directory cannot resolve those dependencies at all. The Dockerfiles
# stay inside their services; only the context is the root.
#
# Local path packages. `counterparty-contracts`, `-domain` and `-storage` stay
# at version 0.1.0 across every change, so `uv sync --frozen` alone will keep an
# already installed copy and a service starts against stale contracts. The
# images resolve this permanently with an explicit `--reinstall-package` for
# each of them; the uv-image steps below, whose virtualenvs live in named
# volumes across runs, do the same for exactly the same reason.

name: counterparty

x-uv: &uv
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  volumes:
    - .:/workspace
    - uv-cache:/uv-cache
  environment:
    UV_CACHE_DIR: /uv-cache
    UV_LINK_MODE: copy
    UV_FROZEN: "1"
  restart: "no"

x-service-health: &service-health
  interval: 10s
  timeout: 3s
  start_period: 15s
  retries: 10

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-counterparty}
      POSTGRES_USER: ${POSTGRES_USER:-counterparty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-counterparty_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Every later step waits on this, so a migration never races initdb.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-counterparty} -d ${POSTGRES_DB:-counterparty}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *uv
    working_dir: /workspace/migrations
    environment:
      UV_CACHE_DIR: /uv-cache
      UV_LINK_MODE: copy
      UV_FROZEN: "1"
      UV_PROJECT_ENVIRONMENT: /venvs/migrations
      COUNTERPARTY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-counterparty}:${POSTGRES_PASSWORD:-counterparty_dev}@postgres:5432/${POSTGRES_DB:-counterparty}
    volumes:
      - .:/workspace
      - uv-cache:/uv-cache
      - migrate-venv:/venvs
    command:
      - sh
      - -c
      - >-
        uv sync --frozen --no-dev --reinstall-package counterparty-storage
        && uv run --frozen --no-dev alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  roles:
    # The revisions create the four service roles as NOLOGIN groups; a login
    # user and its password belong to a deployment, which is what this step is.
    # It is idempotent, and every login inherits exactly one group: the importer
    # may write inside `reports` and holds no DELETE, the MCP login reads
    # `reports` only, and none of them owns a schema.
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-counterparty_dev}
    command:
      - psql
      - --host=postgres
      - --username=${POSTGRES_USER:-counterparty}
      - --dbname=${POSTGRES_DB:-counterparty}
      - --set=ON_ERROR_STOP=1
      # Quoted with '' rather than dollar quoting: Compose would read a `$$`
      # as an escaped dollar and hand psql a broken block.
      - --command=DO 'BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = ''${IMPORTER_USER:-counterparty_import}'') THEN CREATE ROLE ${IMPORTER_USER:-counterparty_import} LOGIN PASSWORD ''${IMPORTER_PASSWORD:-counterparty_import_dev}''; END IF; END';
      - --command=DO 'BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = ''${UI_API_USER:-counterparty_web_dev}'') THEN CREATE ROLE ${UI_API_USER:-counterparty_web_dev} LOGIN PASSWORD ''${UI_API_PASSWORD:-counterparty_web_dev}''; END IF; END';
      - --command=DO 'BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = ''${MCP_USER:-counterparty_mcp_dev}'') THEN CREATE ROLE ${MCP_USER:-counterparty_mcp_dev} LOGIN PASSWORD ''${MCP_PASSWORD:-counterparty_mcp_dev}''; END IF; END';
      - --command=DO 'BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = ''${AGENT_USER:-counterparty_agent_dev}'') THEN CREATE ROLE ${AGENT_USER:-counterparty_agent_dev} LOGIN PASSWORD ''${AGENT_PASSWORD:-counterparty_agent_dev}''; END IF; END';
      - --command=GRANT counterparty_importer TO ${IMPORTER_USER:-counterparty_import};
      - --command=GRANT counterparty_ui_api TO ${UI_API_USER:-counterparty_web_dev};
      - --command=GRANT counterparty_mcp TO ${MCP_USER:-counterparty_mcp_dev};
      - --command=GRANT counterparty_agent TO ${AGENT_USER:-counterparty_agent_dev};
      - --command=GRANT CONNECT ON DATABASE ${POSTGRES_DB:-counterparty} TO ${IMPORTER_USER:-counterparty_import}, ${UI_API_USER:-counterparty_web_dev}, ${MCP_USER:-counterparty_mcp_dev}, ${AGENT_USER:-counterparty_agent_dev};
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  import:
    <<: *uv
    working_dir: /workspace/scripts/import_reports
    environment:
      UV_CACHE_DIR: /uv-cache
      UV_LINK_MODE: copy
      UV_FROZEN: "1"
      UV_PROJECT_ENVIRONMENT: /venvs/import
      # Connects as the importer role: it may write inside `reports` and holds
      # no DELETE at all, so the database is what stops the script from
      # removing anything, not the script's own restraint.
      COUNTERPARTY_DATABASE_URL: postgresql+psycopg://${IMPORTER_USER:-counterparty_import}:${IMPORTER_PASSWORD:-counterparty_import_dev}@postgres:5432/${POSTGRES_DB:-counterparty}
    volumes:
      - .:/workspace
      - uv-cache:/uv-cache
      - import-venv:/venvs
    # The importer is a script and a job, never a service: it runs, prints its
    # import report and exits. Running it again is a no-op, which the report's
    # `changed_nothing` states rather than assumes.
    command:
      - sh
      - -c
      - >-
        uv sync --frozen --no-dev
        --reinstall-package counterparty-contracts
        --reinstall-package counterparty-domain
        --reinstall-package counterparty-storage
        && uv run --frozen --no-dev python -m import_reports import
        /workspace/artifacts/contractors_audit.snapshot.json
    depends_on:
      roles:
        condition: service_completed_successfully

  checkpoints:
    # LangGraph owns its own checkpoint tables and Alembic does not manage them.
    # The DDL runs once as the schema owner; the agent's runtime login never
    # receives it.
    image: ${COMPOSE_PROJECT_NAME:-counterparty}-agent:local
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      AGENT_POSTGRES_DSN: postgresql://${POSTGRES_USER:-counterparty}:${POSTGRES_PASSWORD:-counterparty_dev}@postgres:5432/${POSTGRES_DB:-counterparty}
    command: ["python", "-m", "counterparty_agent.deploy_checkpoints"]
    # A job is finished, not healthy; the image healthcheck belongs to the server.
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ui_api:
    build:
      context: .
      dockerfile: services/ui_api/Dockerfile
    environment:
      UI_API_DATABASE_URL: postgresql+psycopg://${UI_API_USER:-counterparty_web_dev}:${UI_API_PASSWORD:-counterparty_web_dev}@postgres:5432/${POSTGRES_DB:-counterparty}
      # Local HTTP only. The cookie stays HttpOnly and SameSite=Lax either way;
      # a deployment behind TLS leaves this unset.
      UI_API_SESSION_COOKIE_SECURE: "false"
      # Shared secret for the session-less internal endpoint the agent calls to
      # pin a company by INN. Local default only; a deployment sets its own.
      UI_API_INTERNAL_TOKEN: ${UI_API_INTERNAL_TOKEN:-counterparty-local-demo-internal-token}
    ports:
      - "${UI_API_PORT:-8000}:8000"
    healthcheck:
      <<: *service-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
    depends_on:
      import:
        condition: service_completed_successfully

  agent:
    # The same image as the checkpoint job: one build, two entrypoints.
    image: ${COMPOSE_PROJECT_NAME:-counterparty}-agent:local
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      AGENT_POSTGRES_DSN: postgresql://${AGENT_USER:-counterparty_agent_dev}:${AGENT_PASSWORD:-counterparty_agent_dev}@postgres:5432/${POSTGRES_DB:-counterparty}
      AGENT_UI_API_URL: http://ui_api:8000
      AGENT_UI_API_INTERNAL_TOKEN: ${UI_API_INTERNAL_TOKEN:-counterparty-local-demo-internal-token}
      AGENT_MCP_URL: http://mcp:8000/mcp
      AGENT_MCP_AUTH_TOKEN: ${AGENT_MCP_AUTH_TOKEN:-counterparty-local-demo-agent-token}
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-deterministic}
      AGENT_MODEL_ID: ${AGENT_MODEL_ID:-counterparty-deterministic-v1}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-${APIKEY:-}}
      AGENT_MODEL_MAX_TOKENS: ${AGENT_MODEL_MAX_TOKENS:-4096}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-120}
    # One worker per database: the checkpointer expects a single writer.
    command: ["uvicorn", "counterparty_agent.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "${AGENT_PORT:-8001}:8000"
    healthcheck:
      <<: *service-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
    depends_on:
      checkpoints:
        condition: service_completed_successfully
      ui_api:
        condition: service_healthy
      mcp:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    environment:
      MCP_DATABASE_URL: postgresql+psycopg://${MCP_USER:-counterparty_mcp_dev}:${MCP_PASSWORD:-counterparty_mcp_dev}@postgres:5432/${POSTGRES_DB:-counterparty}
      # The service is given the digest of the agent credential, never the
      # credential itself, and without a digest it fails closed and accepts no
      # token at all. The default is the digest of the published demo token
      # `counterparty-local-demo-agent-token`, which is therefore not a secret
      # and must not be reused anywhere: a deployment sets MCP_AUTH_TOKEN_SHA256
      # to the digest of AGENT_MCP_AUTH_TOKEN; rotate both together.
      MCP_AUTH_TOKEN_SHA256: ${MCP_AUTH_TOKEN_SHA256:-4324614cacb9c535d773665d2460baeb7ed664456974c124ce1bfbb767d1b5c4}
    ports:
      - "${MCP_PORT:-8002}:8000"
    healthcheck:
      <<: *service-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
    depends_on:
      import:
        condition: service_completed_successfully

  web:
    # A static bundle with no environment: it is built without an API base URL
    # and reaches the backend as a same-origin /api/v1 through the proxy, which
    # is also why no credential can be baked into it.
    build:
      context: apps/web
      dockerfile: Dockerfile
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]

  proxy:
    image: nginx:1.28-alpine
    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      <<: *service-health
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
    depends_on:
      web:
        condition: service_healthy
      ui_api:
        condition: service_healthy
      agent:
        condition: service_healthy

volumes:
  postgres-data:
  uv-cache:
  migrate-venv:
  import-venv:
