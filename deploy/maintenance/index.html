<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Демо готовится</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #101828; }
      main { box-sizing: border-box; width: min(560px, calc(100% - 32px)); padding: 44px; border-radius: 24px; background: white; box-shadow: 0 18px 60px rgba(16, 24, 40, .12); }
      small { color: #ef3124; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 18px 0 12px; font-size: clamp(32px, 7vw, 52px); line-height: 1.04; }
      p { margin: 0; color: #475467; font-size: 18px; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <small>Counterparty</small>
      <h1>Демо пока закрыто</h1>
      <p>Напишите команде проекта — мы включим демонстрацию для вас.</p>
    </main>
  </body>
</html>
