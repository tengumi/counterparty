# Single edge of the local stack. The browser talks to one origin, so the
# session cookie stays first-party and the SPA needs no API base URL — the same
# contract the Vite dev proxy provides on the host.
#
# The internal MCP is deliberately absent from this file. It is called by the
# agent over the compose network with a server-side credential; publishing it
# through the browser edge would put an internal read service on the public
# side of the demo.

upstream web_static {
    server web:8080;
}

server {
    listen 80;
    server_name _;

    # Re-resolve service names through Docker's DNS instead of caching an IP at
    # startup: after `make rebuild` recreates ui_api/agent they get new IPs, and
    # a cached one silently routes /api/v1 to the wrong service (a plain 404).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The report corpus and comparisons are ordinary JSON, but a slow read must
    # not be cut into a fake empty answer.
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/v1/ {
        set $ui_api "ui_api";
        proxy_pass http://$ui_api:8000$request_uri;
    }

    location /rpc/agent/ {
        # The agent streams; buffering would hold a run's tokens back.
        proxy_buffering off;
        proxy_read_timeout 360s;
        set $agent "agent";
        proxy_pass http://$agent:8000$request_uri;
    }

    location /agent/ {
        proxy_buffering off;
        proxy_read_timeout 360s;
        set $agent_svc "agent";
        proxy_pass http://$agent_svc:8000/;
    }

    location / {
        proxy_pass http://web_static;
    }
}
