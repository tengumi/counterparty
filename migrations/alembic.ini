# Alembic configuration for the Counterparty Workspace PostgreSQL schemas.
#
# The database URL is not stored here. It is read from COUNTERPARTY_DATABASE_URL
# (or from -x database_url=...) so that no credential ends up in the repository.

[alembic]
script_location = .
prepend_sys_path = .
version_path_separator = os
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
