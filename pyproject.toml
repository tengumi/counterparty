[project]
name = "counterparty-agent"
version = "0.1.0"
description = "Grounded AI assistant for counterparty checks and comparisons"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ag-ui-langgraph>=0.0.42",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.5.4",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite",
    "openai>=2,<3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rapidfuzz",
    "uvicorn>=0.52.1",
]

[project.scripts]
counterparty-api = "counterparty_agent.app:run"
counterparty-llm-check = "counterparty_agent.llm:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov",
    "ruff>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["counterparty_agent"]
