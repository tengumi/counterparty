[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counterparty-agent"
version = "0.1.0"
description = "Agent runtime service for Counterparty Workspace"
requires-python = ">=3.13,<3.14"
dependencies = [
  "assistant-stream>=0.0.36,<0.1",
  "counterparty-contracts",
  "fastapi>=0.128,<1",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.12,<3",
  "uvicorn[standard]>=0.40,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.13,<0.16",
]

[tool.uv.sources]
counterparty-contracts = { path = "../../packages/contracts" }

[tool.hatch.build.targets.wheel]
packages = ["src/counterparty_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# assistant-stream ships no py.typed marker; the local boundary in
# transport/delivery.py keeps the untyped surface to one module.
module = ["assistant_stream.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

